<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0A0F1A">
<title>Run Sheets</title>
<style>
:root{
  --s0:#0A0F1A; --s1:#0F1626; --s2:#151E31; --s3:#1C2740; --s4:#243252;
  --line:rgba(148,163,184,.13); --line2:rgba(148,163,184,.26); --line3:rgba(148,163,184,.42);
  --t1:#E8EDF5; --t2:#A3AFC2; --t3:#6B7890;
  --acc:#5B9DFF; --acc2:#8FC0FF; --acc-bg:rgba(91,157,255,.14); --acc-glow:rgba(91,157,255,.35);
  --red:#FF5C70; --red-bg:rgba(255,92,112,.13); --red-line:rgba(255,92,112,.4);
  --green:#3DD68C; --green-bg:rgba(61,214,140,.12); --green-line:rgba(61,214,140,.4);
  --tap:48px; --nav:66px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--s0);color:var(--t1);
  font:15.5px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 50% -120px,rgba(91,157,255,.16),transparent 70%)}
h1,h2,h3{margin:0;font-weight:640;letter-spacing:-.015em;color:var(--t1)}
h1{font-size:18px}h2{font-size:17px}h3{font-size:15px}
p{margin:0 0 10px}
button{font:inherit;font-variant-numeric:tabular-nums;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;font-variant-numeric:tabular-nums;color:var(--t1)}
svg{display:block;flex:0 0 auto}
.hide{display:none!important}
::selection{background:var(--acc-glow)}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:30;background:rgba(10,15,26,.82);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{font-size:17px;letter-spacing:.01em}
.top h1:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);margin-right:10px;vertical-align:1px}
.top .stamp{font-size:12.5px;color:var(--t3);white-space:nowrap;letter-spacing:.02em}
.top .stamp b{color:var(--t1);font-weight:600}
.wk-bar{display:flex;align-items:stretch;border-top:1px solid var(--line);max-width:960px;margin:0 auto}
.wk-arrow{flex:0 0 40px;border:0;background:none;color:var(--t2);font-size:26px;line-height:1;padding:0}
.wk-arrow[disabled]{opacity:.25}
.wk-strip{flex:1;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:8px 4px;cursor:grab;outline:0;user-select:none;-webkit-user-select:none;min-height:62px}
.wk-strip::-webkit-scrollbar{height:0}
.wk-strip:focus-visible{box-shadow:inset 0 0 0 2px var(--acc);border-radius:10px}
.wk-strip:focus-visible .wk.on{box-shadow:0 0 0 2px var(--acc),0 0 22px -4px var(--acc-glow)}
.wk-strip::-webkit-scrollbar{display:none}
.wk{flex:0 0 92px;min-width:92px;user-select:none;-webkit-user-select:none;border:1px solid var(--line);background:var(--s1);border-radius:9px;padding:7px 10px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;color:var(--t3);text-align:left}
.wk .wn{font-size:15px;font-weight:700;color:var(--t1);letter-spacing:-.01em}
.wk .wp{font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--t3)}
.wk .wc{font-size:11px;color:var(--t3);margin-top:2px}
.wk.now .wn:after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);margin-left:6px;vertical-align:2px}
.wk.on{border-color:var(--acc);background:var(--acc-bg);box-shadow:0 0 0 1px var(--acc),0 0 16px -4px var(--acc-glow)}
.wk.on .wn,.wk.on .wp,.wk.on .wc{color:#fff}
main{max-width:960px;margin:0 auto;padding:18px 16px calc(var(--nav) + 30px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,22,38,.9);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line2);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:960px;margin:0 auto;display:flex}
.nav button{flex:1;min-height:var(--nav);border:0;background:none;color:var(--t3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:600;position:relative;letter-spacing:.02em}
.nav button[aria-selected="true"]{color:var(--acc2)}
.nav button[aria-selected="true"]:after{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.nav button .pip{position:absolute;top:10px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 10px rgba(255,92,112,.6)}
@media (min-width:760px){
  .nav{position:sticky;top:calc(118px + env(safe-area-inset-top));bottom:auto;border-top:0;border-bottom:1px solid var(--line)}
  .nav button{min-height:50px;flex-direction:row;gap:8px;font-size:14px}
  .nav button[aria-selected="true"]:after{top:auto;bottom:0}
  .nav button .pip{position:static;margin-left:2px}
  main{padding-bottom:40px}
}

/* ---------- primitives ---------- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),var(--s1);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
.card-b{padding:16px}
.card-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--t2);font-size:14px;line-height:1.5}
.small{font-size:13px;color:var(--t3);line-height:1.5}
.empty{padding:38px 16px;text-align:center;color:var(--t3)}
label{display:block;font-size:11.5px;font-weight:700;color:var(--t3);margin-bottom:6px;letter-spacing:.06em;text-transform:uppercase}
.grid{display:flex;gap:12px;flex-wrap:wrap}
.grid>label{flex:1 1 140px;min-width:0;margin-bottom:12px}
input,select,textarea{width:100%;min-height:var(--tap);padding:9px 12px;background:var(--s2);border:1px solid var(--line2);border-radius:8px;font-weight:500;letter-spacing:0;text-transform:none}
input::placeholder,textarea::placeholder{color:var(--t3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-bg)}
input[readonly]{color:var(--t2)}
input[type="date"],input[type="time"]{color-scheme:dark}
button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
textarea{min-height:84px;resize:vertical;line-height:1.5}
select{-webkit-appearance:none;appearance:none;padding-right:34px;
  background-image:linear-gradient(45deg,transparent 50%,var(--t2) 50%),linear-gradient(135deg,var(--t2) 50%,transparent 50%);
  background-position:calc(100% - 17px) 21px,calc(100% - 12px) 21px;background-size:5px 5px;background-repeat:no-repeat}
select option{background:var(--s3);color:var(--t1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:var(--tap);padding:0 18px;border-radius:9px;border:1px solid var(--line2);background:var(--s2);color:var(--t1);font-weight:600;font-size:15px;transition:transform .08s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#061024;box-shadow:0 0 0 1px rgba(91,157,255,.2),0 8px 24px -8px var(--acc-glow)}
.btn.brand{background:linear-gradient(135deg,#6FAEFF,#3C7BEA);border-color:transparent;color:#fff;font-weight:680;letter-spacing:.01em;
  box-shadow:0 0 0 1px rgba(111,174,255,.35),0 14px 40px -12px rgba(91,157,255,.7)}
.btn.big{width:100%;min-height:64px;font-size:17px;border-radius:12px}
.btn.quiet{border-color:transparent;color:var(--acc2);background:none}
.btn.danger{color:var(--red);border-color:var(--red-line);background:var(--red-bg)}
.btn.sm{min-height:38px;padding:0 13px;font-size:13.5px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}.sheet.busy .sstat:before{animation:none}}

/* ---------- week strip ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:16px 0 6px}
.week button{border:1px solid var(--line);background:var(--s1);border-radius:10px;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--t3)}
.week button .d{font-size:10.5px;font-weight:700;letter-spacing:.08em}
.week button .n{font-size:17px;font-weight:660;color:var(--t1)}
.week button .c{font-size:11.5px;min-height:16px;color:var(--t3)}
.week button .c b{color:var(--acc2);font-weight:700}
.week button .c i{font-style:normal;color:var(--red);font-weight:700;margin-left:5px}
.week button[aria-pressed="true"] .c i{color:#FFD7DD}
.week button[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-bg);box-shadow:0 0 0 1px var(--acc),0 0 18px -4px var(--acc-glow)}
.week button[aria-pressed="true"] .n,.week button[aria-pressed="true"] .c,.week button[aria-pressed="true"] .c b,.week button[aria-pressed="true"] .d{color:#fff}
.week button.today .d{color:var(--acc2)}

/* ---------- log rows ---------- */
.dayhead{display:flex;align-items:center;gap:12px;margin:20px 0 8px;font-size:11.5px;font-weight:700;color:var(--t3);letter-spacing:.08em;text-transform:uppercase}
.dayhead:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sheet{background:var(--s1);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden;position:relative}
.sheet:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--line3)}
.sheet.review{border-color:var(--red-line)}
.sheet.review:before{background:var(--red);box-shadow:0 0 12px var(--red)}
.sheet.clear:before{background:var(--green);box-shadow:0 0 10px rgba(61,214,140,.5)}
.sheet.busy:before{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.shead{display:flex;align-items:stretch;position:relative}
.stoggle{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:13px 6px 13px 17px;background:none;border:0;text-align:left}
.smain{flex:1;min-width:0}
.sname{display:block;font-size:16px;font-weight:660;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smeta{display:flex;flex-wrap:wrap;font-size:12.5px;color:var(--t3);margin-top:3px}
.smeta span+span{margin-left:8px;padding-left:8px;border-left:1px solid var(--line2)}
.smeta em{font-style:normal;color:var(--acc2);font-weight:600}
.sstat{display:inline-flex;align-items:center;gap:7px;margin-top:8px;font-size:12.5px;font-weight:650;color:var(--t2)}
.sstat:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--t3)}
.sheet.review .sstat{color:var(--red)}.sheet.review .sstat:before{background:var(--red);box-shadow:0 0 8px var(--red)}
.sheet.clear .sstat{color:var(--green)}.sheet.clear .sstat:before{background:var(--green);box-shadow:0 0 8px var(--green)}
.sheet.busy .sstat{color:var(--acc2)}.sheet.busy .sstat:before{background:var(--acc);box-shadow:0 0 8px var(--acc);animation:pulse 1.2s ease-in-out infinite}
.chev{color:var(--t3);padding:0 4px}
.pickbox{flex:0 0 auto;width:46px;border:0;border-right:1px solid var(--line);background:none;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.pickbox:before{content:"";width:20px;height:20px;border:2px solid var(--line3);border-radius:5px;position:absolute}
.pickbox[aria-pressed="true"]{color:#061024}
.pickbox[aria-pressed="true"]:before{background:var(--acc);border-color:var(--acc);box-shadow:0 0 12px -2px var(--acc-glow)}
.pickbox svg{position:relative;z-index:1}
.sheet.picked{border-color:var(--acc)}
.ibtn{flex:0 0 auto;width:46px;border:0;border-left:1px solid var(--line);background:none;color:var(--t3);display:flex;align-items:center;justify-content:center}
.ibtn:hover{color:var(--acc2);background:var(--acc-bg)}
.ibtn[data-act="delsheet"]:hover{color:var(--red);background:var(--red-bg)}
.sbody{border-top:1px solid var(--line);padding:16px 14px;background:var(--s0)}

.photowrap{display:block;width:100%;padding:0;border:0;background:none;position:relative;margin-bottom:14px}
.photoexp{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;
  background:rgba(10,15,26,.82);border:1px solid var(--line2);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--t1)}
.photowrap:hover .photoexp{border-color:var(--acc);color:var(--acc2)}
.viewer{position:fixed;inset:0;z-index:200;background:rgba(6,10,18,.97);display:flex;flex-direction:column}
.viewer-bar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line2);background:var(--s1)}
.viewer-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px;display:block;text-align:center}
.viewer-body img{width:100%;max-width:1100px;height:auto;border-radius:6px;background:#fff}
.photo{width:100%;max-height:300px;display:block;object-fit:contain;background:var(--s2);border:1px solid var(--line);border-radius:10px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:12.5px;color:var(--t3);background:var(--s2)}
.pill b{color:var(--t1);font-weight:650}

.decision{border:1px solid var(--red-line);border-radius:10px;background:var(--red-bg);padding:14px;margin-bottom:12px}
.decision.done{border-color:var(--green-line);background:var(--green-bg)}
.decision .t{font-size:15.5px;font-weight:660;margin-bottom:3px}
.decision .d{font-size:13.5px;color:var(--t2);margin-bottom:12px;line-height:1.5}
.decide{display:flex;gap:10px}
.decide button{flex:1;min-height:var(--tap);border-radius:9px;border:1px solid var(--line2);background:var(--s2);font-weight:660;color:var(--t1)}
.decide button[data-on="1"][data-k="approve"]{background:var(--green);border-color:var(--green);color:#04150C;box-shadow:0 0 18px -4px rgba(61,214,140,.7)}
.decide button[data-on="1"][data-k="deny"]{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 18px -4px rgba(255,92,112,.7)}
.notice{border:1px solid rgba(91,157,255,.4);border-radius:10px;padding:13px 14px;margin-bottom:12px;background:var(--acc-bg);font-size:14px;line-height:1.5}
.notice.bad{border-color:var(--red-line);background:var(--red-bg)}
.strayrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line2)}
.strayrow strong{font-size:15px}
.crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.crewchip{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;border:1px solid var(--line2);
  background:var(--s2);text-align:left;min-height:52px}
.crewchip .cdot{flex:0 0 auto;width:9px;height:9px;border-radius:50%;background:var(--t3)}
.crewchip .cname{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crewchip .cwhen{font-size:11px;color:var(--t3);white-space:nowrap}
.crewchip.in{border-color:var(--green-line);background:var(--green-bg)}
.crewchip.in .cdot{background:var(--green);box-shadow:0 0 8px var(--green)}
.crewchip.in .cwhen{color:var(--green)}
.crewchip.owing{border-color:var(--red-line);background:var(--red-bg)}
.crewchip.owing .cdot{background:var(--red);box-shadow:0 0 8px var(--red)}
.crewchip.owing .cwhen{color:var(--red)}
.crewchip.off,.crewchip.restday{opacity:.5}
.crewchip.unknown{border-style:dashed}

/* ---------- moves ---------- */
table.moves{width:100%;border-collapse:collapse;font-size:14px}
table.moves th{text-align:left;font-size:10.5px;color:var(--t3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:0 5px 8px;border-bottom:1px solid var(--line2)}
table.moves td{padding:5px 3px;border-bottom:1px solid var(--line);vertical-align:middle}
table.moves input,table.moves select{min-height:42px;padding:7px 8px;font-size:14px;border-radius:7px}
table.moves select{background-position:calc(100% - 14px) 18px,calc(100% - 10px) 18px;padding-right:26px}
.mwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.mwrap table{min-width:690px}
.tag{display:inline-block;min-width:24px;text-align:center;border-radius:5px;padding:2px 6px;font-size:11.5px;font-weight:700;background:var(--s3);color:var(--t2)}
.tag.b{background:var(--acc);color:#061024;box-shadow:0 0 10px -2px var(--acc-glow)}.tag.q{background:var(--red-bg);color:var(--red)}

/* ---------- tallies ---------- */
.seg{display:flex;background:var(--s1);border:1px solid var(--line2);border-radius:10px;padding:3px;margin-bottom:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:8px;background:none;font-weight:600;color:var(--t3);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--acc);color:#061024;box-shadow:0 4px 16px -6px var(--acc-glow)}
.gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
table.tally{border-collapse:collapse;width:100%;min-width:660px;font-size:14px}
table.tally th,table.tally td{border-bottom:1px solid var(--line);padding:9px 10px}
table.tally thead th{background:var(--s3);color:var(--t2);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:center;border-bottom:1px solid var(--line2);white-space:nowrap}
table.tally thead th small{display:block;font-size:13.5px;font-weight:650;letter-spacing:0;text-transform:none;color:var(--t1);margin-top:2px}
table.tally th.lane{text-align:left;font-weight:500;white-space:nowrap;position:sticky;left:0;background:var(--s1);z-index:2;border-right:1px solid var(--line2);color:var(--t1)}
table.tally thead th.lane{background:var(--s3);color:var(--t2);z-index:3}
table.tally td{text-align:center;min-width:46px;color:var(--t3)}
table.tally td.has{color:var(--acc2);font-weight:660;background:var(--acc-bg)}
table.tally td.tot{background:var(--s2);font-weight:700;color:var(--t1)}
table.tally tr.grp th{background:var(--s2);font-size:10.5px;color:var(--t3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:left}
table.tally tr.gap th,table.tally tr.gap td{height:8px;padding:0;background:var(--s0)}
table.tally td .cb{color:#fff}
.legend{font-size:13px;color:var(--t3);margin-top:10px}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.stat{background:var(--s1);padding:15px 16px}
.stat .k{font-size:10.5px;color:var(--t3);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:5px;color:var(--t1)}
.stat.hot .v{color:var(--red);text-shadow:0 0 18px rgba(255,92,112,.4)}.stat.good .v{color:var(--green);text-shadow:0 0 18px rgba(61,214,140,.35)}
details.more{border:1px solid var(--line);border-radius:10px;background:var(--s1);padding:0 14px;margin-top:14px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:640;min-height:var(--tap);display:flex;align-items:center;color:var(--t1);list-style:none}
details.more summary::-webkit-details-marker{display:none}

  /* ================================================================

  function esc(s) {

    for (i = 0; i < R.length; i++) for (var p = 0; p < parts.length; p++) if (R[i].n.toUpperCase().indexOf(parts[p]) >= 0) return R[i].n;
    return "";

  function normTime(raw) {
    var s = String(raw || "").toUpperCase().replace(/[^0-9:APM]/g, "");
    if (!s) return "";
    var m = s.match(/^(\d{1,2}):(\d{2})(AM|PM|A|P)?$/);
    if (!m) { var d = s.match(/^(\d{3,4})(AM|PM|A|P)?$/); if (d) m = [null, d[1].slice(0, d[1].length - 2), d[1].slice(-2), d[2]]; }
    if (!m) return "";
    var hh = parseInt(m[1], 10), mm = parseInt(m[2], 10), ap = m[3] ? m[3].charAt(0) : "";

    return "";
  }

  /* ================================================================

     ================================================================ */
  function normType(t) {
    var v = String(t || "").toUpperCase().replace(/[^A-Z\/]/g, "");

  function looksBobtail(s) { var v = String(s || "").toUpperCase().replace(/[\s.\-]/g, ""); return v === "BT" || v === "B/T" || v === "BOBTAIL" || v === "BOB"; }
  function isBobtail(mv) {

  function pump() {
    if (reading) {
      // If the phone killed the request while we were in the background, the flag is a lie. Reset it.

        var dead = findSheet(readingId);
        reading = false; readingId = "";
        if (dead) { dead.reading = false; dead.readError = "The phone dropped the connection mid-read. Tap Try again."; save(); try { render(); } catch (e) { } }
      } else return;

    // The 8 s spacing exists for Gemini's free-tier rate limit. A paid Anthropic

    var gap = readerAvailable() === "claude" ? 2000 : READ_GAP;

            '</div>';
        }
        h += '</div>';
      }
      h += '</div>';
    }
    var warnQ = list.filter(function (s) { return s.warn && s.warn.length; });
    if (warnQ.length) h += '<div class="notice bad" style="margin-bottom:12px"><strong>' + warnQ.length + ' sheet' + (warnQ.length === 1 ? '' : 's') +

    if (DAYSEL) h += '<div class="row" style="justify-content:space-between"><button class="btn sm" data-act="emailsel">Email ' + prettyDate(DAYSEL) + ' to work</button><button class="btn quiet sm" data-act="allday">Show the whole week</button></div>';

    var shown = DAYSEL ? list.filter(function (s) { return s.date === DAYSEL; }) : list;
    if (ONLYFLAG) shown = shown.filter(function (s) { return sheetStatus(s).k === "review"; });
    if (!shown.length) {
      h += '<div class="card"><div class="empty">' +
        (ONLYFLAG ? 'Nothing needs attention' + (DAYSEL ? ' on ' + prettyDate(DAYSEL) : ' this week') + '.<br><button class="btn sm" data-act="onlyflag" style="margin-top:12px">Show everything</button>'
          : DAYSEL ? 'Nothing logged on ' + prettyDate(DAYSEL) + '.'

    }
    shown = shown.slice().sort(function (a, b) { if (a.date !== b.date) return a.date < b.date ? 1 : -1; return (a.driver || "zzz") < (b.driver || "zzz") ? -1 : 1; });
    var last = "";
    for (var k = 0; k < shown.length; k++) {

  }

  function pastePanel() {

  // Who is expected today, and whose sheet is in. Green in, red still owing,
  // grey not scheduled or marked off.
  function checklist(f, dates, list) {
    var cday = DAYSEL;
    if (!cday) {
      for (var d = 6; d >= 0; d--) {
        for (var s = 0; s < list.length; s++) if (list[s].date === dates[d]) { cday = dates[d]; break; }
        if (cday) break;
      }
    }
    if (!cday) cday = dates[fiscal(todayISO()).dow] || dates[0];
    var dow = fiscal(cday).dow;
    var got = {};
    for (var g = 0; g < DB.sheets.length; g++) if (DB.sheets[g].date === cday && DB.sheets[g].driver) got[DB.sheets[g].driver] = DB.sheets[g].id;
    var off = (DB.offDays && DB.offDays[cday]) || {};

    var R = roster(), rows = [], inCount = 0, owing = 0;
    for (var i = 0; i < R.length; i++) {
      var dr = R[i], has = !!got[dr.n], isOff = !!off[dr.n];
      var set = shiftDays(dr.sh), due = set ? !!set[dow] : null;
      var state = has ? "in" : isOff ? "off" : (due === true ? "owing" : due === false ? "restday" : "unknown");
      if (has) inCount++;
      if (state === "owing") owing++;
      rows.push({ dr: dr, state: state, id: got[dr.n] || "" });
    }
    rows.sort(function (a, b) {
      var rank = { owing: 0, in: 1, unknown: 2, off: 3, restday: 4 };
      if (rank[a.state] !== rank[b.state]) return rank[a.state] - rank[b.state];
      return a.dr.n < b.dr.n ? -1 : 1;
    });

    var h = '<div class="card" style="margin-bottom:12px"><div class="card-h">' +
      '<div><h3 style="margin:0">Sheets in for ' + prettyDate(cday) + '</h3>' +
      '<div class="small">' + inCount + ' in' + (owing ? ', <span style="color:var(--red)">' + owing + ' still owing</span>' : ', none outstanding') + '</div></div>' +
      '<button class="btn sm quiet" data-act="togglecheck">' + (CHECK_OPEN ? 'Hide' : 'Show') + '</button></div>';
    if (CHECK_OPEN) {
      h += '<div class="card-b"><div class="crew">';
      for (var r = 0; r < rows.length; r++) {

        h += '<button class="crewchip ' + R2.state + '" data-crew="' + esc(R2.dr.n) + '" data-day="' + cday + '"' +
          (R2.id ? ' data-open="' + R2.id + '"' : '') + '>' +
          '<span class="cdot"></span><span class="cname">' + esc(R2.dr.n.replace(/\s*\(.*\)$/, "")) + '</span>' +
          '<span class="cwhen">' + esc(R2.state === "in" ? "logged" : R2.state === "owing" ? "no sheet" : R2.state === "off" ? "marked off" : R2.state === "restday" ? "not scheduled" : "pattern unclear") + '</span></button>';
      }
      h += '</div><p class="small" style="margin:12px 0 0">Tap a name that is in to open it. Tap one that is owing to mark the driver off for the day.</p></div>';
    }
    return h + '</div>';
  }

  function sheetRow(sh) {
    var st = sheetStatus(sh), open = !!OPEN[sh.id], bob = 0;
    for (var m = 0; m < sh.moves.length; m++) if (isBobtail(sh.moves[m])) bob++;
    var h = '<div class="sheet ' + st.k + (PICK[sh.id] ? ' picked' : '') + '" data-sid="' + sh.id + '"><div class="shead">';

      (sh.auto ? '<span>read from photo</span>' : '') +

      '<span class="chev">' + (open ? ICON.up : ICON.down) + '</span></button>';

  function sheetBody(sh, a) {
    var fi = fiscal(sh.date), h = '';

    }

    if (sh.readError) h += '<div class="notice bad"><strong>Could not read the photo.</strong><br>' + esc(sh.readError) +
      '<div class="row" style="margin-top:10px"><button class="btn sm" data-act="reread">Try again</button><button class="btn sm quiet" data-act="clearerr">Fill it in myself</button></div></div>';
    if (sh.movedFrom && sh.readDate) {
      h += '<div class="notice bad"><strong>Date check.</strong> The sheet reads <b>' + prettyDate(sh.readDate) + '</b> (week ' + fiscal(sh.readDate).week +

        '<div class="row" style="margin-top:10px">' +
        '<button class="btn sm primary" data-act="usereaddate">Move it to ' + prettyDate(sh.readDate) + '</button>' +

    }
    if (sh.fixes && sh.fixes.length) {
      h += '<div class="notice" style="border-left-color:var(--acc)"><strong>Tidied ' + sh.fixes.length + ' thing' + (sh.fixes.length === 1 ? '' : 's') + ' against what the app already knows.</strong>' +
        '<ul style="margin:8px 0 0;padding-left:20px">';

      h += '</ul></div>';
    }

      for (var wn = 0; wn < sh.warn.length; wn++) h += '<li>' + esc(sh.warn[wn]) + '</li>';
      h += '</ul><div class="row" style="margin-top:10px"><button class="btn sm" data-act="opusread">Re-read with Opus</button>' +

    h += '<div class="grid"><label>Driver<select data-f="driver">' + driverOptions(sh.driver) + '</select></label>' +

    h += '<div class="pills"><span class="pill">Period <b>' + fi.period + '</b></span><span class="pill">Week <b>' + fi.wop + '</b></span><span class="pill"><b>' + DAYS[fi.dow] + '</b></span>' +
      (a.sched ? '<span class="pill">Scheduled <b>' + a.sched.s + '&ndash;' + a.sched.e + '</b></span>' : '') + '</div>';
    h += '<div class="grid"><label>Start time<input type="time" data-f="start" value="' + esc(sh.start) + '"></label>' +
      '<label>Finish time<input type="time" data-f="end" value="' + esc(sh.end) + '"></label>' +
      '<label>Tractor<input type="text" data-f="tractor" value="' + esc(sh.tractor) + '"></label></div>';

    h += '<h3 style="margin:12px 0 10px">Moves</h3><div class="mwrap"><table class="moves"><thead><tr>' +
      '<th style="width:20%">From</th><th style="width:20%">To</th><th style="width:17%">BOL</th><th style="width:11%">Type</th>' +
      '<th style="width:15%">Trailer</th><th style="width:9%">Leave</th><th style="width:9%">Arrive</th><th></th></tr></thead><tbody>';
    for (var i = 0; i < sh.moves.length; i++) h += moveRow(sh.moves[i]);
    h += '</tbody></table></div><button class="btn" data-act="addmove" style="width:100%;margin-top:12px">Add a move</button>';

    h += '<details class="more"><summary>Mileage and comments</summary><div class="grid">' +
      '<label>Mileage in<input type="text" inputmode="numeric" data-f="mileIn" value="' + esc(sh.mileIn) + '"></label>' +
      '<label>Mileage out<input type="text" inputmode="numeric" data-f="mileOut" value="' + esc(sh.mileOut) + '"></label>' +
      '<label>Total<input type="text" readonly value="' + mileTotal(sh) + '"></label></div>' +
      '<label>Comments<textarea data-f="comments">' + esc(sh.comments) + '</textarea></label>' +
      (sh.hasPhoto ? '<button class="btn sm quiet" data-act="rmphoto">Remove the photo</button>' : '') + '</details>';
    return h;
  }
  function mileTotal(sh) { var a = parseInt(String(sh.mileIn).replace(/\D/g, ""), 10), b = parseInt(String(sh.mileOut).replace(/\D/g, ""), 10); return (isNaN(a) || isNaN(b)) ? "" : String(Math.abs(b - a)); }
  function driverOptions(sel) {
    var h = '<option value="">Pick a driver</option>', R = roster();
    for (var i = 0; i < R.length; i++) h += '<option value="' + esc(R[i].n) + '"' + (R[i].n === sel ? ' selected' : '') + '>' + esc(R[i].n) + ' (' + R[i].loc + ')</option>';
    return h;
  }
  function moveRow(mv) {

  function opt(v, label, cur) { return '<option value="' + v + '"' + (normType(cur) === v || (v === "" && !normType(cur)) ? ' selected' : '') + '>' + label + '</option>'; }

  function decisions(sh, a) {
    var h = '';
    if (a.startFlag) {
      var early = a.startDiff < 0;
      h += decisionCard(sh, "dStart", early ? "Started " + fmtMin(-a.startDiff) + " early" : "Started " + fmtMin(a.startDiff) + " late",
        "Scheduled " + a.sched.s + ", clocked " + sh.start + ". " + (early ? fmtHrs(-a.startDiff) + " h outside the regular shift." : "No overtime from a late start."), early ? -a.startDiff : 0);
    }
    if (a.endFlag) {
      var late = a.endDiff > 0;
      h += decisionCard(sh, "dEnd", late ? "Finished " + fmtMin(a.endDiff) + " late" : "Finished " + fmtMin(-a.endDiff) + " early",
        "Scheduled " + a.sched.e + ", clocked " + sh.end + ". " + (late ? fmtHrs(a.endDiff) + " h outside the regular shift." : "No overtime from an early finish."), late ? a.endDiff : 0);

  }
  function decisionCard(sh, field, line, detail, otMin) {

    if (otMin) h += '<div class="decide"><button data-act="decide" data-field="' + field + '" data-k="approve" data-on="' + (st === "approve" ? 1 : 0) + '">Approve overtime</button>' +
      '<button data-act="decide" data-field="' + field + '" data-k="deny" data-on="' + (st === "deny" ? 1 : 0) + '">Deny</button></div>';
    return h + '</div>';
  }

  /* ---- hours ---- */
  function viewHours(list, t) {
    var rate = parseFloat(DB.rate), otH = hrs(t.approved), stH = parseFloat(DB.straightHours); if (isNaN(stH)) stH = 0;
    var h = '<div class="stats">' + stat("Bobtails", t.bobtails) + stat("Straight time", stH.toFixed(2) + " h") +
      stat("Overtime approved", otH.toFixed(2) + " h", t.approved ? "good" : "") + stat("Paid at 1.5\u00d7", (Math.round(otH * 150) / 100).toFixed(2) + " h") +
      stat("Awaiting decision", hrs(t.pending).toFixed(2) + " h", t.pending ? "hot" : "") + stat("Denied", hrs(t.denied).toFixed(2) + " h");
    if (!isNaN(rate) && rate > 0) h += stat("Straight pay", "$" + (stH * rate).toFixed(2)) + stat("Overtime pay", "$" + (otH * rate * 1.5).toFixed(2)) + stat("Saved by denials", "$" + (hrs(t.denied) * rate * 1.5).toFixed(2));
    h += '</div>';
    h += '<div class="card"><div class="card-b"><div class="grid">' +
      '<label>Straight time hours<input type="text" inputmode="decimal" data-g="straightHours" value="' + esc(DB.straightHours) + '"></label>' +
      '<label>Hourly rate, optional<input type="text" inputmode="decimal" data-g="rate" value="' + esc(DB.rate) + '" placeholder="39.06"></label>' +
      '<label>Flag anything over<select data-g="thresholdMin">' + thOpt(0, "any difference") + thOpt(5, "5 min") + thOpt(10, "10 min") + thOpt(15, "15 min") + thOpt(30, "30 min") + '</select></label></div>' +
      '<p class="small" style="margin:0">Overtime is minutes worked outside the regular shift. Only approved minutes count.</p></div></div>';
    var any = false, body = '';
    for (var i = 0; i < list.length; i++) {
      var sh = list[i], a = assess(sh); if (!a.flagged) continue; any = true;
      body += '<div class="card" data-sid="' + sh.id + '"><div class="card-h"><div><h3>' + esc(sh.driver) + '</h3><div class="small">' + prettyDate(sh.date) + '</div></div></div><div class="card-b">' + decisions(sh, a) + '</div></div>';
    }
    h += '<h2 style="margin:20px 0 12px">Times outside the schedule</h2>';

    return h;
  }
  function thOpt(v, label) { return '<option value="' + v + '"' + (+DB.thresholdMin === v ? ' selected' : '') + '>' + label + '</option>'; }
  function stat(k, v, cls) { return '<div class="stat ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }

  function onClick(ev) {

    if (act === "gostray" && sh) {

        OPEN = {}; OPEN[sh.id] = 1;
        save(); render();
        toast("Moved to " + prettyDate(to) + ".");
      }
      return;
    }
    if (act === "onlyflag") { ONLYFLAG = !ONLYFLAG; render(); return; }
    if (act === "startpick") { PICKING = true; render(); return; }
    if (act === "stoppick") { PICKING = false; PICK = {}; render(); return; }
    if (act === "pick" && sh) { if (PICK[sh.id]) delete PICK[sh.id]; else PICK[sh.id] = 1; render(); return; }
    if (act === "pickall") {

      if (!la2.length) { toast("Tick some sheets first."); return; }
      la2.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.driver < b.driver ? -1 : 1); });

      var r2 = parsePaste(box.value);

      var added = 0, replaced = 0;
      for (var s4 = 0; s4 < r2.sheets.length; s4++) {

      var wk = fiscal(r2.sheets[0].date).week; if (wk >= 1 && wk <= MAXWEEK) WEEK = wk;
      save(); render(); window.scrollTo(0, 0);
      toast(added + " added" + (replaced ? ", " + replaced + " replaced" : "") + "." + (r2.problems.length ? " " + r2.problems[0] : ""));
      return;
    }
    if (act === "toggle" && sh) { if (OPEN[sh.id]) delete OPEN[sh.id]; else OPEN[sh.id] = 1; if (sh.auto) { sh.auto = false; save(); } render(); return; }
    if (act === "delsheet" && sh) {
      if (window.confirm("Delete " + (sh.driver || "this sheet") + "?")) { DB.sheets = DB.sheets.filter(function (x) { return x.id !== sh.id; }); delete OPEN[sh.id]; dropPhoto(sh.id); save(); render(); }
      return;
    }
    if (act === "reread" && sh) { sh.readError = ""; sh.reading = true; if (readingId === sh.id) { reading = false; readingId = ""; } if (READQ.indexOf(sh.id) < 0) READQ.push(sh.id); render(); pump(); return; }
    if (act === "cancelread" && sh) { READQ = READQ.filter(function (x) { return x !== sh.id; }); if (readingId === sh.id) { reading = false; readingId = ""; } sh.reading = false; save(); render(); pump(); return; }
    if (act === "readall") {
      var f3 = activeWeek(), ids4 = unreadSheets(sheetsInWeek(f3));
      for (var u = 0; u < ids4.length; u++) { var us = findSheet(ids4[u]); if (us) { us.reading = true; us.readError = ""; READQ.push(us.id); } }
      render(); pump(); return;
    }
    if (act === "usereaddate" && sh) {
      sh.date = sh.readDate; sh.wkFiled = fiscal(sh.date).week;
      delete sh.movedFrom; delete sh.readDate;
      WEEK = sh.wkFiled; save(); render(); toast("Moved to W" + WEEK + ".");
      return;
    }
    if (act === "keepdate" && sh) { delete sh.movedFrom; delete sh.readDate; save(); render(); return; }
    if (act === "clearwarn" && sh) { sh.warn = []; sh.fixes = []; save(); render(); return; }
    if (act === "opusread" && sh) {
      if (!String(DB.apiKey || "").trim()) { toast("Opus needs an Anthropic key on the Setup tab."); return; }
      sh.escalated = 0; sh.readError = ""; sh.reading = true; sh.forceOpus = 1;
      if (READQ.indexOf(sh.id) < 0) READQ.push(sh.id);
      render(); pump(); return;
    }
    if (act === "clearerr" && sh) { sh.readError = ""; save(); render(); return; }
    if (act === "zoom" && sh) { ZOOM = sh.id; ZOOMLVL = 1; render(); return; }
    if (act === "closezoom") { ZOOM = ""; render(); return; }
    if (act === "zoomin" || act === "zoomout") {
      ZOOMLVL = Math.min(5, Math.max(1, (ZOOMLVL || 1) * (act === "zoomin" ? 1.5 : 1 / 1.5)));
      var vi = el("viewerimg");
      if (vi) vi.style.width = (ZOOMLVL * 100) + "%";
      return;
    }
    if (act === "rmphoto" && sh) { sh.hasPhoto = false; dropPhoto(sh.id); save(); render(); return; }
    if (act === "addmove" && sh) { sh.moves.push(blankMove()); save(); render(); return; }
    if (act === "delmove" && sh) { var tr = closestAttr(a, "data-mid"); if (tr) { var mid = tr.getAttribute("data-mid"); sh.moves = sh.moves.filter(function (x) { return x.id !== mid; }); save(); render(); } return; }
    if (act === "decide" && sh) { var field = a.getAttribute("data-field"), k = a.getAttribute("data-k"); sh[field] = (sh[field] === k) ? "pending" : k; save(); render(); return; }

    if (act === "adddriver") { ADD_DRIVER = true; render(); return; }
    if (act === "canceldriver") { ADD_DRIVER = false; render(); return; }
    if (act === "savedriver") {
      var nm = val("nd_n").toUpperCase(); if (!nm) { toast("Give the driver a name."); return; }
      if (driverByName(nm)) { toast(nm + " is already on the roster."); return; }
      var s = val("nd_s"), e2 = val("nd_e"); if (!s || !e2) { toast("Set a start and a finish time."); return; }
      DB.drivers.push({ n: nm, g: val("nd_g"), loc: val("nd_loc").toUpperCase() || "TOR", sh: val("nd_sh"), s: s, e: e2 });
      DB.drivers.sort(function (x, y) { return x.n < y.n ? -1 : 1; });
      ADD_DRIVER = false; save(); render(); toast(nm + " added."); return;
    }
    if (act === "deldriver") {
      var row = closestAttr(a, "data-di"); if (!row) return;
      var di = +row.getAttribute("data-di"), dr = DB.drivers[di]; if (!dr) return;
      var used = 0; for (var s2 = 0; s2 < DB.sheets.length; s2++) if (DB.sheets[s2].driver === dr.n) used++;
      if (window.confirm("Remove " + dr.n + " from the roster?" + (used ? "\n\n" + used + " run sheet(s) name this driver and will lose their schedule." : ""))) { DB.drivers.splice(di, 1); save(); render(); }
      return;
    }
    if (act === "resetdrivers") { if (window.confirm("Put the roster back to the 26 drivers from the P10 W1 schedule?")) { DB.drivers = JSON.parse(JSON.stringify(SEED_DRIVERS)); save(); render(); } return; }
    if (act === "sbtest" || act === "sbsync") {
      if (!sbOn()) { toast("Fill in both the project URL and the publishable key."); return; }
      if (/^sb_secret_/.test(String(DB.sbKey || "").trim())) { toast("That is the secret key. Use the sb_publishable_ one."); return; }
      var root = sbRoot();
      if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(root)) { toast("The project URL should look like https://abcdefgh.supabase.co"); return; }
      if (DB.sbUrl !== root) { DB.sbUrl = root; save(); }
      a.disabled = true; a.textContent = "Working";
      syncPush().then(function () { return syncPull(); }).then(function () {
        startPolling(); render();
        toast(SYNC === "err" ? "Could not sync. Check the URL, the key and the SQL." : "Connected. This device is in sync.");
      });
      return;
    }
    if (act === "sbclear") {
      if (window.confirm("Disconnect from Supabase? This device keeps its own copy; nothing on the server is deleted.")) {
        DB.sbUrl = ""; DB.sbKey = ""; if (pullT) clearInterval(pullT);
        setSync("off"); save(); render();
      }
      return;
    }
    if (act === "hardreload") {
      try {
        var u = String(window.location.href).split("?")[0].split("#")[0];
        window.location.replace(u + "?v=" + Date.now());
      } catch (e) { toast("Close the tab and reopen it."); }
      return;
    }
    if (act === "copylog") {
      var L2 = [];
      for (var z = 0; z < READLOG.length; z++) L2.push(READLOG[z].t + "  " + READLOG[z].k.toUpperCase() + "  " + READLOG[z].who + "  " + READLOG[z].m);
      copyText(L2.join("\n"));
      return;
    }
    if (act === "clearkey") { DB.apiKey = ""; save(); render(); return; }
    if (act === "cleargemini") { DB.geminiKey = ""; save(); render(); return; }
    if (act === "testgemini" || act === "testkey") {
      var isG = act === "testgemini";
      var kk = String(isG ? DB.geminiKey : DB.apiKey || "").trim();
      if (!kk) { toast("Paste a key in first."); return; }
      a.disabled = true; a.textContent = "Testing";
      var tiny = "/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AKp//2Q==";
      var probe = isG ? callGemini(tiny) : callClaude(tiny, true);
      probe.then(function (res) {
        render();
        if (res.ok) { toast((isG ? "Gemini" : "Anthropic") + " key works. Photographed sheets will fill themselves in."); return; }
        logRead(null, "fail", "key test: " + apiError(res));
        toast(apiError(res));
      })["catch"](function (e) {
        render();
        var m = (e && e.message) ? e.message : "";
        logRead(null, "fail", "key test: " + (m || "no response"));
        toast("Could not reach " + (isG ? "Google" : "Anthropic") + "." + (m ? " " + m : " Check the network."));
      });
      return;
    }
    if (act === "savealias") { var ta = document.querySelector('[data-g="aliasText"]'); if (ta) { DB.aliases = parseAliasText(ta.value); save(); render(); toast("Place names saved."); } return; }
    if (act === "resetalias") { DB.aliases = JSON.parse(JSON.stringify(DEFAULT_ALIASES)); save(); render(); return; }

    var f2 = activeWeek(), list = sheetsInWeek(f2), dates = weekDates(f2), tag = "P" + f2.period + " W" + f2.wop;
    if (act === "emailday" || act === "copyday") {
      var sel = el("emailday"), dv2 = sel ? sel.value : (DAYSEL || todayISO());
      EMAILDAY = dv2;
      if (act === "emailday" && !String(DB.emailTo || "").trim()) { toast("Put your work address in Send to first."); return; }
      if (act === "emailday") emailDay(dv2); else copyText(dayText(dv2));
      return;
    }
    if (act === "emailsel") {
      if (!String(DB.emailTo || "").trim()) { TAB = "export"; EMAILDAY = DAYSEL; render(); toast("Add your work address, then tap Email this day."); return; }
      emailDay(DAYSEL); return;
    }
    if (act === "copyweekraw") {
      var lw = sheetsInWeek(activeWeek()).slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.driver < b.driver ? -1 : 1); });
      if (!lw.length) { toast("Nothing logged this week."); return; }
      copyText(sheetsToText(lw));
      toast(lw.length + " sheet" + (lw.length === 1 ? "" : "s") + " copied as paste text.");
      return;
    }
    if (act === "csvtally") { try { download("Transport Tally " + tag + ".xlsx", xlsxTally(list, dates, f2), XL.MIME); toast("Tally workbook downloaded."); } catch (e) { download("Transport Tally " + tag + ".csv", csvCombined(list, dates, f2)); toast("Excel build failed here, sent the CSV instead."); } return; }
    if (act === "copytally") { copyText(csvCombined(list, dates, f2)); return; }
    if (act === "csvmoves") { var mr = rowsMoves(list); try { download("Moves " + tag + ".xlsx", xlsxTable("Every move " + tag, "One row per move on every run sheet in the week", mr[0], mr.slice(1), [7, 7, 7, 8, 6, 11, 22, 10, 10, 10, 5, 22, 22, 22, 22, 12, 7, 11, 8, 8, 10, 8]), XL.MIME); } catch (e) { download("Moves " + tag + ".csv", csvMoves(list)); } return; }
    if (act === "csvhours") { var hr = rowsHours(list); try { download("Hours " + tag + ".xlsx", xlsxTable("Hours and overtime " + tag, "Scheduled versus actual times, with the OT approve / deny decisions", hr[0], hr.slice(1), [7, 7, 7, 6, 11, 22, 10, 9, 10, 10, 10, 10, 10, 10, 10, 10, 11, 11, 11, 11, 11, 9, 8]), XL.MIME); } catch (e) { download("Hours " + tag + ".csv", csvHours(list)); } return; }
    if (act === "gosave") { ev.preventDefault(); TAB = "export"; render(); var sc = el("savecopy"); if (sc && sc.scrollIntoView) sc.scrollIntoView(); return; }
    if (act === "savecopy") {
      var withPhotos = !!(el("cp_photos") && el("cp_photos").checked), withKeys = !!(el("cp_keys") && el("cp_keys").checked);
      var db2 = JSON.parse(JSON.stringify(DB));
      db2.copyAt = new Date().toISOString();
      if (!withKeys) { db2.apiKey = ""; db2.geminiKey = ""; }
      for (var q = 0; q < db2.sheets.length; q++) { delete db2.sheets[q].reading; delete db2.sheets[q].readError; }
      var ids3 = []; if (withPhotos) for (var p2 = 0; p2 < DB.sheets.length; p2++) if (DB.sheets[p2].hasPhoto) ids3.push(DB.sheets[p2].id);
      Promise.all(ids3.map(loadPhoto)).then(function (imgs) {
        var photos = {}; for (var r = 0; r < ids3.length; r++) if (imgs[r]) photos[ids3[r]] = imgs[r];
        if (!withPhotos) for (var s3 = 0; s3 < db2.sheets.length; s3++) db2.sheets[s3].hasPhoto = false;
        var payload = JSON.stringify({ db: db2, photos: photos }).replace(/<\/script/gi, "<\\/script");
        var doc = document.documentElement.cloneNode(true);
        var appNode = doc.querySelector("#app"); if (appNode) appNode.innerHTML = '<div class="empty">Loading</div>';
        var fat = doc.querySelector("#fatal"); if (fat) fat.innerHTML = "";
        var tst = doc.querySelector("#toast"); if (tst) { tst.textContent = ""; tst.style.display = "none"; }
        var dl = doc.querySelector("#loclist"); if (dl) dl.parentNode.removeChild(dl);
        var old = doc.querySelector("#embedded-data"); if (old) old.parentNode.removeChild(old);
        var s = document.createElement("script"); s.id = "embedded-data"; s.type = "application/json"; s.textContent = payload;
        var body = doc.querySelector("body"); body.insertBefore(s, body.firstChild);
        var html = "<!DOCTYPE html>\n" + doc.outerHTML;
        DB.copyAt = db2.copyAt; save();
        download("Run Sheets " + todayISO() + ".html", html, "text/html;charset=utf-8");
        render();
        toast("Saved. Next time, open that file from your Downloads.");
      });
      return;
    }
    if (act === "backup") {
      var copy = JSON.parse(JSON.stringify(DB)); copy.photos = {};
      var ids = []; for (var p = 0; p < DB.sheets.length; p++) if (DB.sheets[p].hasPhoto) ids.push(DB.sheets[p].id);
      Promise.all(ids.map(loadPhoto)).then(function (imgs) { for (var q = 0; q < ids.length; q++) if (imgs[q]) copy.photos[ids[q]] = imgs[q]; download("RunSheets backup " + tag + ".json", JSON.stringify(copy), "application/json"); });
      return;
    }
    if (act === "wipe") {
      if (window.confirm("Remove every run sheet in " + tag + "? This cannot be undone.")) {
        var ids2 = {}; for (var i = 0; i < list.length; i++) { ids2[list[i].id] = 1; dropPhoto(list[i].id); }
        DB.sheets = DB.sheets.filter(function (x) { return !ids2[x.id]; }); save(); render();
      }
      return;
    }
  }

  function onChange(ev) {
    var t = ev.target, act = t.getAttribute("data-act");
    if (act === "shoot") return shoot(ev);
    if (act === "restore") return restore(ev);
    commit(ev, true);
  }
  function onInput(ev) {
    if (ev.target && ev.target.id === "pastebox") { showPasteCount(); return; }
    commit(ev, false);
  }
  // A truncated copy is the commonest way this goes wrong, so count it up front.
  function showPasteCount() {
    var box = el("pastebox"), out = el("pastecount");
    if (!box || !out) return;
    var txt = box.value;
    if (!txt.replace(/\s/g, "")) { out.innerHTML = "Nothing pasted yet."; out.style.color = ""; return; }
    var r = parsePaste(txt), n = r.sheets.length, m = 0, names = [];
    for (var i = 0; i < n; i++) {
      m += r.sheets[i].moves.filter(function (x) { return x.from || x.to; }).length;
      names.push((r.sheets[i].driver || "unnamed").split(" ")[0]);
    }
    var dashes = (txt.match(/^\s*-{3,}\s*$/gm) || []).length;
    var cut = dashes >= n && n > 0;   // a trailing separator with no sheet after it
    out.innerHTML = "<b>" + n + "</b> sheet" + (n === 1 ? "" : "s") + ", <b>" + m + "</b> move" + (m === 1 ? "" : "s") +
      " &mdash; " + esc(names.join(", ")) +
      (cut ? '<br><span style="color:var(--red)">The text ends on a separator, so the copy may have been cut off.</span>' : "");
    out.style.color = "";
  }
  function commit(ev, rerender) {
    var t = ev.target, card = closestAttr(t, "data-sid"), g = t.getAttribute && t.getAttribute("data-g");
    if (g && g !== "aliasText") { DB[g] = t.value; save(); if (g === "thresholdMin" || rerender) render(); return; }
    if (!card) return;
    var sh = findSheet(card.getAttribute("data-sid")); if (!sh) return;
    var f = t.getAttribute("data-f");
    if (f) { sh[f] = t.value; if (f === "start" || f === "end" || f === "driver") { sh.dStart = "pending"; sh.dEnd = "pending"; } save(); if (rerender || f === "date" || f === "driver" || f === "start" || f === "end") render(); return; }
    var mf = t.getAttribute("data-m");
    if (mf) { var tr = closestAttr(t, "data-mid"); if (!tr) return; var mid = tr.getAttribute("data-mid");
      for (var i = 0; i < sh.moves.length; i++) if (sh.moves[i].id === mid) { sh.moves[i][mf] = t.value; break; }
      save(); if (rerender) render(); }
  }

  // Camera or gallery. Each photo becomes its own sheet and goes into the read queue.
  function shoot(ev) {
    var input = ev.target; if (!input.files || !input.files.length) return;
    var files = []; for (var i = 0; i < input.files.length; i++) files.push(input.files[i]);
    input.value = "";
    var f = activeWeek(), wd = weekDates(f), date = DAYSEL || todayISO();
    if (date < wd[0] || date > wd[6]) date = wd[1];
    var canRead = !!readerAvailable();
    var made = [];
    for (var n = 0; n < files.length; n++) { var fresh = blankSheet(date); fresh.reading = canRead; fresh.hasPhoto = true; DB.sheets.unshift(fresh); made.push(fresh); }
    if (made.length === 1) { OPEN = {}; OPEN[made[0].id] = 1; }
    TAB = "log"; render(); window.scrollTo(0, 0);
    for (var k = 0; k < files.length; k++) (function (file, sheet) {
      shrink(file, function (full, small) {
        PHOTOS[sheet.id] = full;                 // read from the sharp one
        savePhoto(sheet.id, small, true);        // keep the light one
        if (canRead) { READQ.push(sheet.id); pump(); }
        save(); render();
      });
    })(files[k], made[k]);
    if (!canRead) toast("Photo attached. Add a free Gemini key on the Setup tab to have sheets read automatically.");
  }
  function reshrink(dataUrl, max, q, cb) {
    try {
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.width, h = img.height;
          if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
          var c = document.createElement("canvas"); c.width = w; c.height = h;
          var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
          cb(c.toDataURL("image/jpeg", q));
        } catch (e) { cb(dataUrl); }
      };
      img.onerror = function () { cb(dataUrl); };
      img.src = dataUrl;
    } catch (e) { cb(dataUrl); }
  }
  function shrink(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        try {
          function at(max, q) {
            var w = img.width, h = img.height;
            if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
            var c = document.createElement("canvas"); c.width = w; c.height = h;
            var ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
            return c.toDataURL("image/jpeg", q);
          }
          cb(at(1400, 0.75), at(950, 0.5));
        } catch (e) { cb(reader.result, reader.result); }
      };
      img.onerror = function () { cb(reader.result, reader.result); };
      img.src = reader.result;
    };
    reader.onerror = function () { toast("Could not read that photo."); };
    reader.readAsDataURL(file);
  }
  function restore(ev) {
    var input = ev.target; if (!input.files || !input.files[0]) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var next = JSON.parse(r.result); if (!next || !next.sheets) throw new Error("bad");
        var photos = next.photos || {}; delete next.photos;
        DB = next;
        if (!DB.aliases) DB.aliases = JSON.parse(JSON.stringify(DEFAULT_ALIASES));
        if (!DB.drivers || !DB.drivers.length) DB.drivers = JSON.parse(JSON.stringify(SEED_DRIVERS));
        for (var id in photos) if (photos.hasOwnProperty(id)) savePhoto(id, photos[id]);
        save(); render(); toast("Backup restored.");
      } catch (e) { toast("That file is not a run sheet backup."); }
    };
    r.readAsText(input.files[0]);
  }

  /* ================================================================
     Boot
     ================================================================ */
  try {
    document.addEventListener("keydown", function (e) {
      if (ZOOM && (e.keyCode === 27)) { ZOOM = ""; render(); }
    }, false);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) { setTimeout(pump, 400); if (sbOn()) syncPull(true); } }, false);
    window.addEventListener("online", function () { setTimeout(pump, 400); if (sbOn()) syncNow(); }, false);
  } catch (e) { }
  load().then(function () {
    LASTCFG = JSON.stringify(cfgDoc());
    for (var i = 0; i < DB.sheets.length; i++) {
      var c = JSON.parse(JSON.stringify(DB.sheets[i]));
      delete c.reading; delete c.readError; delete c.netTry; delete c.retried; delete c.up;
      LASTPUSH[DB.sheets[i].id] = JSON.stringify(c);
    }
    render();
    if (sbOn()) { syncPull().then(startPolling); }
  })["catch"](function (e) {
    el("fatal").innerHTML = '<div class="notice bad"><strong>Could not start.</strong> ' + esc(e && e.message ? e.message : e) + '</div>';
  });
})();
</script>
